name: Build DoulK Recharges APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          rm -rf project
          mkdir project
          unzip -q DoulKRechargesAndroid.zip -d project

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Construire l'APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: DoulK-Recharges-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
